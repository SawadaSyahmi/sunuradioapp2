name: sun4u_radio
description: A player-first Sunway University Radio app prototype built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.9.42
  intl: ^0.20.2
  device_preview: ^1.0.0
  supabase_flutter: ^2.12.4
  youtube_player_iframe: ^5.2.2
  just_audio_background: ^0.0.1-beta.17
  video_player: ^2.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - design_reference/
